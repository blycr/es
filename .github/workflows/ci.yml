name: 质量检查

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 语法检查
        run: |
          node --check app.js
          node --check scripts/build-single-file.js

      - name: 运行单元测试
        run: node --test

      - name: 验证单文件构建
        run: node scripts/build-single-file.js
